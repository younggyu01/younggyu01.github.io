<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 | 국영규 포트폴리오</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* 어느 경로에서 열려도 같은 모습이 되도록 글꼴과 돌아가는 주소를 사이트 주소 기준으로 적는다. */
@font-face{font-family:"Wanted Sans Variable";font-style:normal;font-weight:400 1000;font-display:swap;src:url(https://younggyu01.github.io/assets/WantedSansVariable.woff2) format("woff2")}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;background:#fff;color:#000;
  font-family:"Wanted Sans Variable","Wanted Sans","Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:17px;line-height:1.72;letter-spacing:-.012em;word-break:keep-all;-webkit-font-smoothing:antialiased}
main{padding:clamp(28px,7vh,104px) clamp(20px,3.4vw,48px);max-width:1760px;width:100%;margin-inline:auto}
h1{margin:0;font-size:clamp(30px,5.6vw,92px);font-weight:650;line-height:1.19;letter-spacing:-.045em}
.socket{position:relative;display:inline-block;width:max(.5em,19px);height:max(.5em,19px);margin-left:.16em;vertical-align:.07em;border:.075em solid #000;border-radius:50%}
.socket::after{content:"";position:absolute;left:50%;top:50%;width:.13em;height:.13em;margin:-.065em 0 0 -.065em;border-radius:50%;background:#000}
.socket::before{content:"";position:absolute;inset:-.075em;border-radius:50%;border:1.5px solid #000;animation:ring 1.5s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(2.1);opacity:0}}
p{margin:clamp(18px,2.2vw,32px) 0 0;font-size:clamp(17px,1.5vw,22px);font-weight:500;line-height:1.5;max-width:30em}
a.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:clamp(20px,2.4vw,36px);min-height:46px;padding:12px 19px;border:1px solid #000;border-radius:999px;background:#000;color:#fff;font-size:15px;font-weight:600;line-height:1.2;text-decoration:none}
a.btn:hover{opacity:.78}
:focus-visible{outline:2px solid #000;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.socket::before{animation:none;opacity:0}}
</style>
</head>
<body>
<main>
  <h1>연결이 끊겼습니다.<span class="socket" aria-hidden="true"></span></h1>
  <p>찾으시는 페이지가 없습니다. 주소가 바뀌었거나 잘못 입력됐을 수 있습니다.</p>
  <a class="btn" href="https://younggyu01.github.io/">포트폴리오로 돌아가기</a>
</main>
</body>
</html>
